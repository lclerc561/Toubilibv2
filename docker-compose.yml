networks:
  toubilib.net:
    driver: bridge

services:

  # --- MICROSERVICE AUTHENTIFICATION ---
  app.auth:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    volumes:
      - ./app-auth:/var/php # Dossier renommé app-auth
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiauth.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # --- api Toubilib ---
  api.toubilib:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6080:80'
    volumes:
      - ./app:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprat.db
      - toubirdv.db
      - toubipatient.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # --- MICROSERVICE PRATICIENS ---
  app.praticiens:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6082:80'
    volumes:
      - ./app-praticiens:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubiprat.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # --- MICROSERVICE RDV ---
  app.rdv:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6083:80'
    volumes:
      - ./app-rdv:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubirdv.db
      - toubipatient.db
      - app.praticiens
    environment:
      - API_PRATICIENS_URL=http://app.praticiens:80
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # --- API GATEWAY ---
  api.gateway.toubilib:
    build:
      context: build
      dockerfile: 8.4-cli.Dockerfile
    ports:
      - '6081:80'
    volumes:
      - ./gateway:/var/php
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - api.toubilib
      - app.praticiens
      - app.rdv
      - app.auth
    environment:
      - API_TOUBILIB_URL=http://api.toubilib:80
      - API_PRATICIENS_URL=http://app.praticiens:80
      - API_RDV_URL=http://app.rdv:80
      - API_AUTH_URL=http://app.auth:80
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  # --- BASES DE DONNÉES ---
  toubiprat.db:
    image: 'postgres:latest'
    env_file: ./toubipratdb.env
    ports:
      - '5432:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/:/var/sql
      - ./sql/toubiprat.schema.sql:/docker-entrypoint-initdb.d/1_toubiprat.schema.sql
      - ./sql/toubiprat.data.sql:/docker-entrypoint-initdb.d/2_toubiprat.data.sql

  toubiauth.db:
    image: 'postgres:latest'
    env_file: ./toubiauthdb.env
    ports:
      - '5433:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql:/var/sql
      - ./sql/toubiauth.schema.sql:/docker-entrypoint-initdb.d/1_toubiauth.schema.sql
      - ./sql/toubiauth.data.sql:/docker-entrypoint-initdb.d/2_toubiauth.data.sql

  toubirdv.db:
    image: 'postgres:latest'
    env_file: ./toubirdvdb.env
    ports:
      - '5434:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/:/var/sql
      - ./sql/toubirdv.schema.sql:/docker-entrypoint-initdb.d/1_toubirdv.schema.sql
      - ./sql/toubirdv.data.sql:/docker-entrypoint-initdb.d/2_toubirdv.data.sql

  toubipatient.db:
    image: 'postgres:latest'
    env_file: ./toubipatientdb.env
    ports:
      - '5435:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql/:/var/sql
      - ./sql/toubipat.schema.sql:/docker-entrypoint-initdb.d/1_toubipat.schema.sql
      - ./sql/toubipat.data.sql:/docker-entrypoint-initdb.d/2_toubipat.data.sql

  adminer:
    image: adminer
    ports:
      - '8080:8080'
    networks:
      - toubilib.net